name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # VULN-004 fix: NODE_ENV has no default anymore, CI must set it explicitly.
      NODE_ENV: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ticketing_ci
          POSTGRES_PASSWORD: ticketing_ci
          POSTGRES_DB: ticketing_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ticketing_ci -d ticketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:openapi
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ticketing_ci:ticketing_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ticketing_test
